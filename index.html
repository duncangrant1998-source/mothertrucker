<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mother Trucker</title>

    <!-- PWA: installable, opens standalone (no browser chrome) from the home
         screen. content="#e85d04" is just the pre-JS fallback (light scheme,
         matches manifest.json's theme_color) — App.jsx overwrites it once
         mounted to track the app's actual effective scheme, including a
         manual drawer override, which a media="(prefers-color-scheme)" meta
         can't react to since that only follows the OS preference. A single
         tag with no media attribute (rather than a light/dark pair) so
         App.jsx's override isn't fighting the browser over which tag wins. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" id="theme-color-meta" content="#e85d04" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mother Trucker" />

    <!-- Industrial Precision typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- HERE Maps — pinned to an explicit patch (not the floating "v3/3.1"
         alias). Every 3.1.x build (bisected 3.1.10.0 through 3.1.69.2) fails
         to render any raster base layer: Tangram throws "Cannot read
         properties of undefined (reading 'retain')" for the non-collision
         style group and the canvas stays blank. Confirmed not an API-key/
         entitlement issue (HERE's raw REST tile endpoint returns valid
         imagery for this key). 3.2.8.0 renders satellite correctly — do not
         move this back to a floating alias or an untested 3.1.x pin. -->
    <link rel="stylesheet" type="text/css" href="https://js.api.here.com/v3/3.2.8.0/mapsjs-ui.css" />
    <script src="https://js.api.here.com/v3/3.2.8.0/mapsjs-core.js"></script>
    <script src="https://js.api.here.com/v3/3.2.8.0/mapsjs-service.js"></script>
    <script src="https://js.api.here.com/v3/3.2.8.0/mapsjs-ui.js"></script>
    <script src="https://js.api.here.com/v3/3.2.8.0/mapsjs-mapevents.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
